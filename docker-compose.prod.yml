services:
  backend:
    build:
      context: ./webeng-backend
      target: production
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      FRONTEND_BASE_URL: "http://localhost"
      JAVA_OPTS: "${JAVA_OPTS:-}"

  frontend:
    build:
      context: .
      target: production
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8080}"
    ports:
      - "${FRONTEND_NGINX_PORT:-80}:80"
    depends_on:
      - backend
