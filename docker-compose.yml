services:
  backend:
    build:
      context: ./webeng-backend
      target: development
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-dev}"
      FRONTEND_BASE_URL: "http://localhost:5173"
    volumes:
      - ./webeng-backend:/app
      - maven-cache:/root/.m2
    command: ["mvn", "-B", "-DskipTests", "spring-boot:run"]

  frontend:
    build:
      context: .
      target: development
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: "${VITE_API_URL:-http://localhost:8080}"
    volumes:
      - ./:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  maven-cache:
  frontend-node-modules:
